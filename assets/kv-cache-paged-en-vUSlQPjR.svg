<rect x="1" y="1" width="718" height="548" rx="16" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1"/>
<text x="28" y="40" font-size="24" fill="#182A43" font-weight="700" text-anchor="start">Block allocation: old data stays in place</text>
