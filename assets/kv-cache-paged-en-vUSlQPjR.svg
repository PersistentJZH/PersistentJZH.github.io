<svg xmlns="http://www.w3.org/2000/svg" width="560" height="427.777778" viewBox="0 0 720 550" role="img" aria-labelledby="title desc">
<title id="title">Block allocation: old data stays in place</title>
<desc id="desc">Each block contains two slots. Initially block 0 holds A1 and A2, block 1 holds B1 and B2, and blocks 2 and 3 are unallocated. Appending A3 assigns block 2 to A, stores A3, and leaves its other slot held for A. A maps to blocks 0 and 2, B maps to block 1, and block 3 remains unallocated.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#356BC3"/></marker></defs>
