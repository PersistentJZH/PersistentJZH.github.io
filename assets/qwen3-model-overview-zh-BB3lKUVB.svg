<text x="732" y="309" font-size="21" fill="#172C45" font-weight="600" text-anchor="start">实际模型尺寸</text>
<text x="732" y="348" font-size="18" fill="#52657B" font-weight="400" text-anchor="start">词表 151936</text>
<text x="732" y="382" font-size="18" fill="#52657B" font-weight="400" text-anchor="start">隐藏维度 2048</text>
<text x="732" y="416" font-size="18" fill="#52657B" font-weight="400" text-anchor="start">16 个 Q / 8 个 KV 头</text>
<text x="732" y="450" font-size="18" fill="#52657B" font-weight="400" text-anchor="start">每头维度 128</text>
<text x="732" y="484" font-size="18" fill="#52657B" font-weight="400" text-anchor="start">FFN 中间维度 6144</text>
<rect x="714" y="542" width="214" height="113" rx="12" fill="#F4F8FD" stroke="#D6E0EA" stroke-width="1.5"/>
<text x="821" y="573" font-size="20" fill="#172C45" font-weight="600" text-anchor="middle">RoPE 位于每一层</text>
<text x="821" y="604" font-size="18" fill="#3568B0" font-weight="400" text-anchor="middle">只作用于 Q / K</text>
<text x="821" y="634" font-size="18" fill="#52657B" font-weight="400" text-anchor="middle">见 Decoder block 详图</text>
<rect x="714" y="704" width="214" height="132" rx="12" fill="#F0FAF7" stroke="#A8D6CA" stroke-width="1.5"/>
<text x="821" y="734" font-size="20" fill="#12665D" font-weight="600" text-anchor="middle">共享同一个 W_E</text>
<text x="821" y="763" font-size="18" fill="#12665D" font-weight="400" text-anchor="middle">虚线表示权重绑定</text>
<text x="821" y="793" font-size="18" fill="#12665D" font-weight="400" text-anchor="middle">tie_word_embeddings</text>
