<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1100" viewBox="0 0 960 1100" role="img" aria-labelledby="title desc">
<title id="title">Qwen3-1.7B · 整体模型结构</title><desc id="desc">Qwen3-1.7B 的真实结构概览。模型外的聊天模板与 tokenizer 将文本转换为形状 B 乘 T 的 token ID。输入 embedding 使用形状 151936 乘 2048 的权重 W_E，得到 B 乘 T 乘 2048 的表示。28 个结构相同但参数不同的 Decoder block 保持隐藏维度 2048。最终 RMSNorm 后取最后一个有效位置，得到 B 乘 2048 的隐藏向量 h，再用共享的 W_E 转置计算 B 乘 151936 的 logits。模型外的采样和解码产生下一个 token。青色虚线表示 embedding 与 lm_head 共享同一权重，不是额外的数据流。RoPE 在每层的 Q 和 K 上施加。B 表示批次大小，T 表示本次处理的 token 数。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#3568B0"/></marker></defs>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif">
