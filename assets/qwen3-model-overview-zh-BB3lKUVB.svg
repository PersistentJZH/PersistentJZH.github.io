<text x="365" y="763" font-size="21" fill="#172C45" font-weight="500" text-anchor="middle">生成时取最后有效位置</text>
<text x="365" y="789" font-size="20" fill="#3568B0" font-weight="400" text-anchor="middle">h  [B, 2048]</text>
<path d="M 365 801 V 827" stroke="#3568B0" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="120" y="832" width="490" height="78" rx="12" fill="#EDF4FC" stroke="#B9CEE7" stroke-width="1.5"/>
<text x="365" y="861" font-size="22" fill="#172C45" font-weight="600" text-anchor="middle">词表投影 · lm_head</text>
<text x="365" y="891" font-size="21" fill="#3568B0" font-weight="400" text-anchor="middle">logits = h W_Eᵀ  →  [B, 151936]</text>
<path d="M 610 355 H 685 V 871 H 610" fill="none" stroke="#168476" stroke-width="2.5" stroke-dasharray="7 6" stroke-linejoin="round"/>
<circle cx="610" cy="355" r="4" fill="#168476"/><circle cx="610" cy="871" r="4" fill="#168476"/>
