<text x="365" y="166" font-size="21" fill="#52657B" font-weight="400" text-anchor="middle">聊天模板 + tokenizer</text>
<text x="718" y="134" font-size="19" fill="#52657B" font-weight="600" text-anchor="start">模型外</text>
<text x="718" y="161" font-size="19" fill="#52657B" font-weight="400" text-anchor="start">文本处理</text>
