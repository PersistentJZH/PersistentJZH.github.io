<rect x="250" y="220" width="230" height="44" rx="10" fill="#FFFFFF" stroke="#B9CEE7" stroke-width="1.5"/>
<text x="365" y="249" font-size="21" fill="#172C45" font-weight="500" text-anchor="middle">Token IDs  [B, T]</text>
<rect x="72" y="277" width="590" height="657" rx="16" fill="#F8FAFD" stroke="#C8D7E8" stroke-width="1.5"/>
<text x="92" y="302" font-size="18" fill="#3568B0" font-weight="600" text-anchor="start">Qwen3ForCausalLM</text>
<path d="M 365 265 V 311" stroke="#3568B0" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="120" y="316" width="490" height="78" rx="12" fill="#EDF4FC" stroke="#B9CEE7" stroke-width="1.5"/>
<text x="365" y="347" font-size="22" fill="#172C45" font-weight="600" text-anchor="middle">Token Embedding · 查表得到向量</text>
<text x="365" y="378" font-size="21" fill="#3568B0" font-weight="400" text-anchor="middle">W_E  [151936, 2048]</text>
<path d="M 365 395 V 423" stroke="#3568B0" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="388" y="416" font-size="18" fill="#52657B" font-weight="400" text-anchor="start">[B, T, 2048]</text>
<rect x="110" y="428" width="510" height="170" rx="13" fill="#EAF2FD" stroke="#ADC6E7" stroke-width="1.5"/>
<text x="365" y="460" font-size="24" fill="#172C45" font-weight="650" text-anchor="middle">28 个 Decoder blocks</text>
<rect x="156" y="479" width="158" height="44" rx="9" fill="#FFFFFF" stroke="#B9CEE7" stroke-width="1.5"/>
<rect x="416" y="479" width="158" height="44" rx="9" fill="#FFFFFF" stroke="#B9CEE7" stroke-width="1.5"/>
<text x="235" y="508" font-size="20" fill="#172C45" font-weight="500" text-anchor="middle">Decoder 0</text>
<text x="495" y="508" font-size="20" fill="#172C45" font-weight="500" text-anchor="middle">Decoder 27</text>
<text x="365" y="511" font-size="30" fill="#3568B0" font-weight="600" text-anchor="middle">···</text>
<text x="365" y="552" font-size="21" fill="#3568B0" font-weight="400" text-anchor="middle">同一结构 · 各层参数不同</text>
<text x="365" y="582" font-size="20" fill="#52657B" font-weight="400" text-anchor="middle">每层 2048 → 2048</text>
