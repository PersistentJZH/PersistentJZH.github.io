<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1100" viewBox="0 0 960 1100" role="img" aria-labelledby="title desc">
<title id="title">Qwen3-1.7B · Model overview</title><desc id="desc">Actual Qwen3-1.7B model structure. Outside the model, the chat template and tokenizer turn text into token IDs of shape B by T. Token embedding uses W_E of shape 151936 by 2048 to produce B by T by 2048 representations. Twenty-eight decoder blocks share the same structure but have different parameters, preserving hidden size 2048. After final RMSNorm, select the last valid position to obtain h of shape B by 2048. The language model head uses the same W_E transposed to compute logits of shape B by 151936. Sampling and decoding outside the model produce the next token. A teal dashed line denotes shared weights, not additional data flow. RoPE acts on Q and K inside each decoder layer. B is the batch size and T is the number of tokens processed in this call.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#3568B0"/></marker></defs>
