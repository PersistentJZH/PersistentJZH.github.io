<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1810" viewBox="0 0 1100 1810" role="img" aria-labelledby="title desc">
<title id="title">Qwen3-1.7B: Inside One Decoder Block</title><desc id="desc">Layer i uses Pre-RMSNorm. Normalize input, project Q/K/V, apply per-head RMSNorm and RoPE to Q/K, and compute causal GQA. Project the output and add the input residual. Then normalize, multiply SiLU of gate projection by up projection, project down, and add the second residual. Hidden size 2048; 16 Q heads and 8 KV heads of size 128; MLP size 6144.</desc>
