<text x="76" y="635" font-size="25" fill="#182A43" font-weight="650" text-anchor="middle">C</text>
<rect x="140" y="491" width="150" height="50" rx="7" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.2"/>
<text x="215.0" y="513" font-size="21" fill="#194C96" font-weight="600" text-anchor="middle">Decode</text>
<text x="215.0" y="534" font-size="18" fill="#194C96" font-weight="400" text-anchor="middle">第 2 个</text>
<rect x="298" y="491" width="150" height="50" rx="7" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.2"/>
<text x="373.0" y="513" font-size="21" fill="#194C96" font-weight="600" text-anchor="middle">Decode</text>
<text x="373.0" y="534" font-size="18" fill="#194C96" font-weight="400" text-anchor="middle">第 3 个 · 结束</text>
<rect x="456" y="491" width="150" height="50" rx="7" fill="#F7F9FB" stroke="#C9D3DF" stroke-width="1.2"/>
