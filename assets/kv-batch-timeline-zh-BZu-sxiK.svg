<svg xmlns="http://www.w3.org/2000/svg" width="560" height="548.8" viewBox="0 0 800 784" role="img" aria-labelledby="title desc">
<title id="title">C 从 Prefill 到 Decode，何时开始？</title><desc id="desc">A、B 在时间线之前已各处理两个提示词位置完成 Prefill，并输出首个 token。C 在轮1结束后到达。固定批：轮1 A/B Decode，B结束；轮2 A Decode并结束，C等待；轮3 C Prefill输出第1个token；轮4 C Decode输出第2个token。连续批：轮2 A Decode与C Prefill同轮，C输出第1个token；轮3 C Decode输出第2个token；轮4继续Decode输出第3个token。每格显示阶段及输出token序号。调度轮不是等长时间单位。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif">
<rect x="1" y="1" width="798" height="782" rx="16" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1.2"/>
<text x="28" y="40" font-size="27" fill="#182A43" font-weight="650" text-anchor="start">C 从 Prefill 到 Decode，何时开始？</text>
<rect x="28" y="59" width="744" height="70" rx="10" fill="#F4F7FB" stroke="#D7E0EA" stroke-width="1.2"/>
<text x="45" y="86" font-size="21" fill="#182A43" font-weight="500" text-anchor="start">共同起点：A、B 各已 Prefill 2 个输入位置</text>
<text x="45" y="114" font-size="20" fill="#506277" font-weight="400" text-anchor="start">各自已输出首个 token；下面从调度轮 1 开始。</text>
<rect x="28" y="145" width="744" height="248" rx="12" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1.2"/>
<text x="44" y="175" font-size="23" fill="#182A43" font-weight="600" text-anchor="start">固定批：等 A、B 都结束才接入 C</text>
<text x="215.0" y="210" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">轮 1</text>
<text x="373.0" y="210" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">轮 2</text>
<text x="531.0" y="210" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">轮 3</text>
<text x="689.0" y="210" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">轮 4</text>
<text x="294" y="198" font-size="15" fill="#8A5710" font-weight="500" text-anchor="middle">C 到达</text>
<path d="M 294 215 L 294 382" fill="none" stroke="#B87916" stroke-width="1.3" stroke-dasharray="4 4"/>
