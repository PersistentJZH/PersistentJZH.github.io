<text x="531.0" y="646" font-size="18" fill="#194C96" font-weight="400" text-anchor="middle">第 2 个</text>
<rect x="614" y="603" width="150" height="50" rx="7" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.2"/>
<text x="689.0" y="625" font-size="21" fill="#194C96" font-weight="600" text-anchor="middle">Decode</text>
<text x="689.0" y="646" font-size="18" fill="#194C96" font-weight="400" text-anchor="middle">第 3 个</text>
<rect x="28" y="680" width="12" height="12" rx="3" fill="#F0E9FF" stroke="#8458BB" stroke-width="1.2"/>
<text x="50" y="693" font-size="20" fill="#68449A" font-weight="400" text-anchor="start">Prefill：处理提示词，输出第 1 个 token。</text>
<rect x="28" y="708" width="12" height="12" rx="3" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.2"/>
<text x="50" y="721" font-size="20" fill="#194C96" font-weight="400" text-anchor="start">Decode：每轮处理 1 个新位置，再输出 1 个 token。</text>
<text x="28" y="754" font-size="19" fill="#506277" font-weight="400" text-anchor="start">格内编号表示输出次序；调度轮不代表相同耗时。</text>
</g></svg>
