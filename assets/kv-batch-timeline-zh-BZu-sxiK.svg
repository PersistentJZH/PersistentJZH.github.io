<rect x="294" y="453" width="158" height="199" rx="10" fill="#F8F7FC" stroke="#D8CBEF" stroke-width="1"/>
<text x="215.0" y="478" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">轮 1</text>
<text x="373.0" y="478" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">轮 2</text>
<text x="531.0" y="478" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">轮 3</text>
<text x="689.0" y="478" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">轮 4</text>
<text x="294" y="466" font-size="15" fill="#8A5710" font-weight="500" text-anchor="middle">C 到达</text>
<path d="M 294 483 L 294 650" fill="none" stroke="#B87916" stroke-width="1.3" stroke-dasharray="4 4"/>
<text x="76" y="523" font-size="25" fill="#182A43" font-weight="650" text-anchor="middle">A</text>
