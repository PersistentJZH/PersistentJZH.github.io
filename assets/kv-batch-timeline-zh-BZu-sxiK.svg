<text x="373.0" y="646" font-size="18" fill="#68449A" font-weight="400" text-anchor="middle">第 1 个</text>
<rect x="456" y="603" width="150" height="50" rx="7" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.2"/>
