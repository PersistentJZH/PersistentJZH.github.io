<svg xmlns="http://www.w3.org/2000/svg" width="560" height="427.777778" viewBox="0 0 720 550" role="img" aria-labelledby="title desc">
<title id="title">按块分配：旧数据不用搬</title>
<desc id="desc">每两格组成一块。开始时块 0 放 A1、A2，块 1 放 B1、B2，块 2、3 可分配。追加 A3 时，将块 2 分给 A，写入 A3，另一格留给 A。A 的块表为 0、2，B 的块表为 1，块 3 仍可分配。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#356BC3"/></marker></defs>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<rect x="1" y="1" width="718" height="548" rx="16" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1"/>
<text x="28" y="40" font-size="25" fill="#182A43" font-weight="700" text-anchor="start">按块分配：旧数据不用搬</text>
<text x="30" y="82" font-size="23" fill="#506277" font-weight="600" text-anchor="start">追加 A3 前</text><rect x="44" y="99" width="152" height="31" rx="6" fill="#E8F0FF" stroke="none" stroke-width="1.5"/><text x="120" y="123" font-size="21" fill="#194C96" font-weight="600" text-anchor="middle">块 0</text><rect x="204" y="99" width="152" height="31" rx="6" fill="#E1F5EE" stroke="none" stroke-width="1.5"/><text x="280" y="123" font-size="21" fill="#115E50" font-weight="600" text-anchor="middle">块 1</text><rect x="364" y="99" width="152" height="31" rx="6" fill="#F8FAFC" stroke="none" stroke-width="1.5"/><text x="440" y="123" font-size="21" fill="#65758A" font-weight="600" text-anchor="middle">块 2</text><rect x="524" y="99" width="152" height="31" rx="6" fill="#F8FAFC" stroke="none" stroke-width="1.5"/><text x="600" y="123" font-size="21" fill="#65758A" font-weight="600" text-anchor="middle">块 3</text><rect x="44" y="141" width="72" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="80.0" y="182.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A1</text><rect x="124" y="141" width="72" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="160.0" y="182.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A2</text><rect x="204" y="141" width="72" height="64" rx="10" fill="#E1F5EE" stroke="#14836D" stroke-width="1.8"/><text x="240.0" y="182.0" font-size="26" fill="#115E50" font-weight="600" text-anchor="middle">B1</text><rect x="284" y="141" width="72" height="64" rx="10" fill="#E1F5EE" stroke="#14836D" stroke-width="1.8"/><text x="320.0" y="182.0" font-size="26" fill="#115E50" font-weight="600" text-anchor="middle">B2</text><rect x="364" y="141" width="72" height="64" rx="10" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/><text x="400.0" y="182.0" font-size="23" fill="#65758A" font-weight="400" text-anchor="middle">空</text><rect x="444" y="141" width="72" height="64" rx="10" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/><text x="480.0" y="182.0" font-size="23" fill="#65758A" font-weight="400" text-anchor="middle">空</text><rect x="524" y="141" width="72" height="64" rx="10" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/><text x="560.0" y="182.0" font-size="23" fill="#65758A" font-weight="400" text-anchor="middle">空</text><rect x="604" y="141" width="72" height="64" rx="10" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/><text x="640.0" y="182.0" font-size="23" fill="#65758A" font-weight="400" text-anchor="middle">空</text><text x="30" y="266" font-size="23" fill="#506277" font-weight="600" text-anchor="start">追加 A3 后：只新分配块 2</text><rect x="44" y="283" width="152" height="31" rx="6" fill="#E8F0FF" stroke="none" stroke-width="1.5"/><text x="120" y="307" font-size="21" fill="#194C96" font-weight="600" text-anchor="middle">块 0</text><rect x="204" y="283" width="152" height="31" rx="6" fill="#E1F5EE" stroke="none" stroke-width="1.5"/><text x="280" y="307" font-size="21" fill="#115E50" font-weight="600" text-anchor="middle">块 1</text><rect x="364" y="283" width="152" height="31" rx="6" fill="#E8F0FF" stroke="none" stroke-width="1.5"/><text x="440" y="307" font-size="21" fill="#194C96" font-weight="600" text-anchor="middle">块 2</text><rect x="524" y="283" width="152" height="31" rx="6" fill="#F8FAFC" stroke="none" stroke-width="1.5"/><text x="600" y="307" font-size="21" fill="#65758A" font-weight="600" text-anchor="middle">块 3</text><rect x="44" y="325" width="72" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="80.0" y="366.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A1</text><rect x="124" y="325" width="72" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="160.0" y="366.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A2</text><rect x="204" y="325" width="72" height="64" rx="10" fill="#E1F5EE" stroke="#14836D" stroke-width="1.8"/><text x="240.0" y="366.0" font-size="26" fill="#115E50" font-weight="600" text-anchor="middle">B1</text><rect x="284" y="325" width="72" height="64" rx="10" fill="#E1F5EE" stroke="#14836D" stroke-width="1.8"/><text x="320.0" y="366.0" font-size="26" fill="#115E50" font-weight="600" text-anchor="middle">B2</text><rect x="364" y="325" width="72" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="3.5"/><text x="400.0" y="366.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A3</text><rect x="444" y="325" width="72" height="64" rx="10" fill="#FFF3D8" stroke="#B87916" stroke-width="1.8" stroke-dasharray="6 4"/><text x="480.0" y="366.0" font-size="23" fill="#8A5710" font-weight="600" text-anchor="middle">A</text><rect x="524" y="325" width="72" height="64" rx="10" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/><text x="560.0" y="366.0" font-size="23" fill="#65758A" font-weight="400" text-anchor="middle">空</text><rect x="604" y="325" width="72" height="64" rx="10" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/><text x="640.0" y="366.0" font-size="23" fill="#65758A" font-weight="400" text-anchor="middle">空</text><rect x="44" y="421" width="304" height="54" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.5"/><text x="196" y="456" font-size="24" fill="#194C96" font-weight="600" text-anchor="middle">A → 块 0、块 2</text><rect x="372" y="421" width="304" height="54" rx="10" fill="#E1F5EE" stroke="#14836D" stroke-width="1.5"/><text x="524" y="456" font-size="24" fill="#115E50" font-weight="600" text-anchor="middle">B → 块 1</text><rect x="44" y="502" width="24" height="24" rx="5" fill="#FFF3D8" stroke="#B87916" stroke-width="1.8" stroke-dasharray="5 3"/><text x="80" y="521" font-size="22" fill="#506277" font-weight="400" text-anchor="start">尚空，但已归 A</text><rect x="372" y="502" width="24" height="24" rx="5" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/><text x="408" y="521" font-size="22" fill="#506277" font-weight="400" text-anchor="start">仍可分配</text>
</g>
