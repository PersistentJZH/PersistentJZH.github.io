<svg xmlns="http://www.w3.org/2000/svg" width="560" height="522.666667" viewBox="0 0 720 672" role="img" aria-labelledby="title desc">
<title id="title">同一调度轮：A Decode，C Prefill</title><desc id="desc">A 已缓存位置1至3，只处理位置4。C 无历史缓存，处理已知的两个输入位置。3行输入共用同一组QKV投影参数。注意力按请求分开：A位置4只读A位置1至4的KV，C位置1只读C位置1，C位置2读C位置1和2。后续逐位置FFN共用参数。A最后位置用于生成下一token，C最后位置2用于生成第一个token。C处理两个输入位置只新增一个输出token，不会把两条请求的文本或上下文混在一起。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#506277"/></marker></defs>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif">
<rect x="1" y="1" width="718" height="670" rx="16" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1.4"/>
<text x="28" y="39" font-size="25" fill="#182A43" font-weight="650" text-anchor="start">同一调度轮：A Decode，C Prefill</text>
<text x="30" y="69" font-size="21" fill="#506277" font-weight="400" text-anchor="start">共享模型参数，各自保留自己的上下文</text>
<rect x="28" y="88" width="320" height="92" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.4"/>
<rect x="372" y="88" width="320" height="92" rx="10" fill="#F0E9FF" stroke="#8458BB" stroke-width="1.4"/>
<text x="188" y="116" font-size="23" fill="#194C96" font-weight="600" text-anchor="middle">A · Decode</text>
<text x="188" y="145" font-size="22" fill="#194C96" font-weight="500" text-anchor="middle">输入：位置 4</text>
<text x="188" y="169" font-size="18" fill="#506277" font-weight="400" text-anchor="middle">已有缓存：位置 1–3 的 K/V</text>
<text x="532" y="116" font-size="23" fill="#68449A" font-weight="600" text-anchor="middle">C · Prefill</text>
<text x="532" y="145" font-size="22" fill="#68449A" font-weight="500" text-anchor="middle">输入：位置 1、2</text>
<text x="532" y="169" font-size="18" fill="#506277" font-weight="400" text-anchor="middle">两个位置都已知，尚无历史缓存</text>
<path d="M 188 181 V 204" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 532 181 V 204" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="208" width="664" height="60" rx="10" fill="#F4F7FA" stroke="#D7E0EA" stroke-width="1.4"/>
<text x="360" y="234" font-size="22" fill="#182A43" font-weight="600" text-anchor="middle">3 行一起做 Q / K / V 投影</text>
<text x="360" y="258" font-size="19" fill="#506277" font-weight="400" text-anchor="middle">使用同一组 W_Q、W_K、W_V</text>
<path d="M 188 269 V 298" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 532 269 V 298" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="302" width="320" height="118" rx="10" fill="#F7FAFF" stroke="#A9C3E6" stroke-width="1.4"/>
<rect x="372" y="302" width="320" height="118" rx="10" fill="#FBF8FF" stroke="#CCB9E7" stroke-width="1.4"/>
<text x="188" y="330" font-size="22" fill="#194C96" font-weight="600" text-anchor="middle">A · 只读自己的 K/V</text>
<text x="188" y="367" font-size="21" fill="#194C96" font-weight="500" text-anchor="middle">Query 4 → 位置 1–4</text>
<text x="188" y="398" font-size="19" fill="#506277" font-weight="400" text-anchor="middle">旧缓存 1–3 + 新算位置 4</text>
<text x="532" y="330" font-size="22" fill="#68449A" font-weight="600" text-anchor="middle">C · 只读自己的 K/V</text>
<text x="532" y="367" font-size="21" fill="#68449A" font-weight="500" text-anchor="middle">Query 1 → 位置 1</text>
<text x="532" y="398" font-size="21" fill="#68449A" font-weight="500" text-anchor="middle">Query 2 → 位置 1、2</text>
<path d="M 188 421 V 448" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 532 421 V 448" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="452" width="664" height="44" rx="10" fill="#F4F7FA" stroke="#D7E0EA" stroke-width="1.4"/>
<text x="360" y="481" font-size="22" fill="#182A43" font-weight="500" text-anchor="middle">FFN 等逐位置计算，也共用模型参数</text>
<path d="M 188 497 V 527" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 532 497 V 527" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="531" width="320" height="69" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.4"/>
<rect x="372" y="531" width="320" height="69" rx="10" fill="#F0E9FF" stroke="#8458BB" stroke-width="1.4"/>
<text x="188" y="557" font-size="20" fill="#506277" font-weight="400" text-anchor="middle">取 A 位置 4 的输出</text>
<text x="188" y="585" font-size="23" fill="#194C96" font-weight="600" text-anchor="middle">A：生成下一个 token</text>
<text x="532" y="557" font-size="20" fill="#506277" font-weight="400" text-anchor="middle">取 C 位置 2 的输出</text>
<text x="532" y="585" font-size="23" fill="#68449A" font-weight="600" text-anchor="middle">C：生成第一个 token</text>
<text x="30" y="632" font-size="21" fill="#182A43" font-weight="500" text-anchor="start">C 处理 2 个输入位置，只生成 1 个新 token。</text>
<text x="30" y="659" font-size="20" fill="#506277" font-weight="400" text-anchor="start">同批执行，注意力仍按请求隔离。</text>
</g></svg>
