<svg xmlns="http://www.w3.org/2000/svg" width="560" height="381.111111" viewBox="0 0 720 490" role="img" aria-labelledby="title desc">
<title id="title">连续扩容：可能需要搬动旧数据</title>
<desc id="desc">原布局为 A1、A2、B1、B2 和四个空位。A3 不能写入 B1 的位置。一种连续扩容方式是将相同的 A1、A2 数据复制到后方空区，再追加 A3；旧 A 位置释放，B 保持原位。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#356BC3"/></marker></defs>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<rect x="1" y="1" width="718" height="488" rx="16" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1"/>
<text x="28" y="40" font-size="25" fill="#182A43" font-weight="700" text-anchor="start">连续扩容：可能需要搬动旧数据</text>
<text x="30" y="82" font-size="23" fill="#506277" font-weight="600" text-anchor="start">原布局：A 后面已经放了 B</text><rect x="44" y="102" width="72" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="80.0" y="143.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A1</text><rect x="124" y="102" width="72" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="160.0" y="143.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A2</text><rect x="204" y="102" width="72" height="64" rx="10" fill="#E1F5EE" stroke="#14836D" stroke-width="1.8"/><text x="240.0" y="143.0" font-size="26" fill="#115E50" font-weight="600" text-anchor="middle">B1</text><rect x="284" y="102" width="72" height="64" rx="10" fill="#E1F5EE" stroke="#14836D" stroke-width="1.8"/><text x="320.0" y="143.0" font-size="26" fill="#115E50" font-weight="600" text-anchor="middle">B2</text><rect x="364" y="102" width="72" height="64" rx="10" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/><text x="400.0" y="143.0" font-size="23" fill="#65758A" font-weight="400" text-anchor="middle">空</text><rect x="444" y="102" width="72" height="64" rx="10" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/><text x="480.0" y="143.0" font-size="23" fill="#65758A" font-weight="400" text-anchor="middle">空</text><rect x="524" y="102" width="72" height="64" rx="10" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/><text x="560.0" y="143.0" font-size="23" fill="#65758A" font-weight="400" text-anchor="middle">空</text><rect x="604" y="102" width="72" height="64" rx="10" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/><text x="640.0" y="143.0" font-size="23" fill="#65758A" font-weight="400" text-anchor="middle">空</text><path d="M 200 96 L 200 173" fill="none" stroke="#AF4935" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="238" y="201" font-size="23" fill="#AF4935" font-weight="600" text-anchor="start">A3 不能覆盖 B1</text><path d="M 118 174 C 118 252, 440 216, 440 305" fill="none" stroke="#356BC3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="191" y="227" width="356" height="40" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="369" y="254" font-size="22" fill="#194C96" font-weight="600" text-anchor="middle">复制旧数据，再追加 A3</text><text x="30" y="295" font-size="23" fill="#506277" font-weight="600" text-anchor="start">一种扩容后的布局</text><rect x="44" y="315" width="72" height="64" rx="10" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/><text x="80.0" y="356.0" font-size="23" fill="#65758A" font-weight="400" text-anchor="middle">空</text><rect x="124" y="315" width="72" height="64" rx="10" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/><text x="160.0" y="356.0" font-size="23" fill="#65758A" font-weight="400" text-anchor="middle">空</text><rect x="204" y="315" width="72" height="64" rx="10" fill="#E1F5EE" stroke="#14836D" stroke-width="1.8"/><text x="240.0" y="356.0" font-size="26" fill="#115E50" font-weight="600" text-anchor="middle">B1</text><rect x="284" y="315" width="72" height="64" rx="10" fill="#E1F5EE" stroke="#14836D" stroke-width="1.8"/><text x="320.0" y="356.0" font-size="26" fill="#115E50" font-weight="600" text-anchor="middle">B2</text><rect x="364" y="315" width="72" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="400.0" y="356.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A1</text><rect x="444" y="315" width="72" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="480.0" y="356.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A2</text><rect x="524" y="315" width="72" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="3.5"/><text x="560.0" y="356.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A3</text><rect x="604" y="315" width="72" height="64" rx="10" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/><text x="640.0" y="356.0" font-size="23" fill="#65758A" font-weight="400" text-anchor="middle">空</text><text x="30" y="421" font-size="23" fill="#506277" font-weight="400" text-anchor="start">原 A 位置已释放；B 保持原位。</text><text x="30" y="459" font-size="23" fill="#194C96" font-weight="600" text-anchor="start">存放地址改变，K/V 数值不变。</text>
</g>
</svg>
