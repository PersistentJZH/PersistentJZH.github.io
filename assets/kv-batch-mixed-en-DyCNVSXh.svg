<svg xmlns="http://www.w3.org/2000/svg" width="560" height="522.666667" viewBox="0 0 720 672" role="img" aria-labelledby="title desc">
<title id="title">One iteration: A decodes, C prefills</title><desc id="desc">A has cached positions 1 through 3 and processes only position 4. C has no history and processes its two known prompt positions. Three input rows share the same QKV projection parameters. Attention remains isolated by request: A position 4 reads only A positions 1 through 4; C position 1 reads only C position 1, and C position 2 reads C positions 1 and 2. Position-wise FFN operations share parameters. A uses its last position to generate its next token; C uses position 2 to generate its first token. C processes two input positions but emits only one new token.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#506277"/></marker></defs>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif">
<rect x="1" y="1" width="718" height="670" rx="16" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1.4"/>
<text x="28" y="39" font-size="25" fill="#182A43" font-weight="650" text-anchor="start">One iteration: A decodes, C prefills</text>
<text x="30" y="69" font-size="20" fill="#506277" font-weight="400" text-anchor="start">Shared model parameters; separate request contexts</text>
<rect x="28" y="88" width="320" height="92" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.4"/>
<rect x="372" y="88" width="320" height="92" rx="10" fill="#F0E9FF" stroke="#8458BB" stroke-width="1.4"/>
<text x="188" y="116" font-size="23" fill="#194C96" font-weight="600" text-anchor="middle">A · Decode</text>
<text x="188" y="145" font-size="22" fill="#194C96" font-weight="500" text-anchor="middle">Input: position 4</text>
<text x="188" y="169" font-size="18" fill="#506277" font-weight="400" text-anchor="middle">Cached K/V: positions 1–3</text>
<text x="532" y="116" font-size="23" fill="#68449A" font-weight="600" text-anchor="middle">C · Prefill</text>
<text x="532" y="145" font-size="21" fill="#68449A" font-weight="500" text-anchor="middle">Input: positions 1 and 2</text>
<text x="532" y="169" font-size="16" fill="#506277" font-weight="400" text-anchor="middle">Both tokens known; no cached history</text>
<path d="M 188 181 V 204" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 532 181 V 204" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="208" width="664" height="60" rx="10" fill="#F4F7FA" stroke="#D7E0EA" stroke-width="1.4"/>
<text x="360" y="234" font-size="22" fill="#182A43" font-weight="600" text-anchor="middle">Project all 3 rows into Q / K / V</text>
<text x="360" y="258" font-size="19" fill="#506277" font-weight="400" text-anchor="middle">Use the same W_Q, W_K, and W_V</text>
<path d="M 188 269 V 298" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 532 269 V 298" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="302" width="320" height="118" rx="10" fill="#F7FAFF" stroke="#A9C3E6" stroke-width="1.4"/>
<rect x="372" y="302" width="320" height="118" rx="10" fill="#FBF8FF" stroke="#CCB9E7" stroke-width="1.4"/>
<text x="188" y="330" font-size="21" fill="#194C96" font-weight="600" text-anchor="middle">A · read only A’s K/V</text>
<text x="188" y="367" font-size="18" fill="#194C96" font-weight="500" text-anchor="middle">Query at 4 → positions 1–4</text>
<text x="188" y="398" font-size="18" fill="#506277" font-weight="400" text-anchor="middle">Cached 1–3 + new position 4</text>
<text x="532" y="330" font-size="21" fill="#68449A" font-weight="600" text-anchor="middle">C · read only C’s K/V</text>
<text x="532" y="367" font-size="18" fill="#68449A" font-weight="500" text-anchor="middle">Query at 1 → position 1</text>
<text x="532" y="398" font-size="18" fill="#68449A" font-weight="500" text-anchor="middle">Query at 2 → positions 1, 2</text>
<path d="M 188 421 V 448" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 532 421 V 448" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="452" width="664" height="44" rx="10" fill="#F4F7FA" stroke="#D7E0EA" stroke-width="1.4"/>
<text x="360" y="481" font-size="19" fill="#182A43" font-weight="500" text-anchor="middle">Position-wise work, including the FFN, also shares parameters</text>
<path d="M 188 497 V 527" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 532 497 V 527" fill="none" stroke="#506277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="531" width="320" height="69" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.4"/>
<rect x="372" y="531" width="320" height="69" rx="10" fill="#F0E9FF" stroke="#8458BB" stroke-width="1.4"/>
<text x="188" y="557" font-size="18" fill="#506277" font-weight="400" text-anchor="middle">Use A’s output at position 4</text>
<text x="188" y="585" font-size="22" fill="#194C96" font-weight="600" text-anchor="middle">A: emit its next token</text>
<text x="532" y="557" font-size="18" fill="#506277" font-weight="400" text-anchor="middle">Use C’s output at position 2</text>
<text x="532" y="585" font-size="22" fill="#68449A" font-weight="600" text-anchor="middle">C: emit its first token</text>
<text x="30" y="632" font-size="19" fill="#182A43" font-weight="500" text-anchor="start">C processes 2 input positions but emits only 1 new token.</text>
<text x="30" y="659" font-size="19" fill="#506277" font-weight="400" text-anchor="start">One batch; attention still stays within each request.</text>
</g></svg>
