<text x="657.5" y="516.5" font-size="18" fill="#12665D" font-weight="600" text-anchor="middle">3 · 爱</text>
<path d="M 711 508 H 734 V 128 H 335" fill="none" stroke="#168476" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#greenArrow)"/>
<text x="535" y="115" font-size="19" fill="#12665D" font-weight="500" text-anchor="middle">Next call: feed the full text</text>
<path d="M 32 693 H 728" fill="none" stroke="#D6E0EA" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="32" y="718" font-size="17" fill="#52657B" font-weight="400" text-anchor="start">Without a cache, the next call processes the old positions again.</text>
