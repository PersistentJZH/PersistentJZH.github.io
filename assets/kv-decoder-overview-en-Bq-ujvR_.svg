<svg xmlns="http://www.w3.org/2000/svg" width="560" height="536.421053" viewBox="0 0 760 728" role="img" aria-labelledby="title desc">
<title id="title">Decoder-only: from input to the next token</title><desc id="desc">One-layer, two-head Post-LN teaching model. Positions 1 and 2 contain 我 and 爱. Token and position embeddings pass through causal multi-head self-attention, residual addition and LayerNorm, an FFN, and another residual addition and LayerNorm. The last position passes through the vocabulary projection and softmax; the most probable next token is 爱 at 51.11%. Append it as position 3 and feed the full text 我 爱 爱 into the next call. Blue marks the current computation; green marks the new token and generation loop.</desc>
<defs>
<marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#3568B0"/></marker>
<marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#168476"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif">
<rect x="1" y="1" width="758" height="726" rx="16" fill="#FFFFFF" stroke="#D6E0EA" stroke-width="1.3"/>
<text x="32" y="43" font-size="30" fill="#172C45" font-weight="650" text-anchor="start">Decoder-only</text>
<text x="32" y="72" font-size="20" fill="#52657B" font-weight="400" text-anchor="start">Existing text → one new token</text>
<rect x="474" y="25" width="254" height="33" rx="16" fill="#F4F7FA" stroke="#F4F7FA" stroke-width="1.3"/>
<text x="601" y="48" font-size="18" fill="#52657B" font-weight="500" text-anchor="middle">Toy model · 1 layer / 2 heads</text>
<text x="55" y="129" font-size="21" fill="#172C45" font-weight="600" text-anchor="start">Input</text>
<rect x="143" y="104" width="83" height="48" rx="8" fill="#F4F7FA" stroke="#D6E0EA" stroke-width="1.3"/>
<text x="184.5" y="136.0" font-size="23" fill="#172C45" font-weight="600" text-anchor="middle">1 · 我</text>
<rect x="244" y="104" width="83" height="48" rx="8" fill="#F4F7FA" stroke="#D6E0EA" stroke-width="1.3"/>
<text x="285.5" y="136.0" font-size="23" fill="#172C45" font-weight="600" text-anchor="middle">2 · 爱</text>
<path d="M 236 153 V 187" fill="none" stroke="#3568B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)"/>
<rect x="100" y="190" width="272" height="49" rx="9" fill="#EDF4FC" stroke="#B9CEE7" stroke-width="1.3"/>
<text x="236" y="221" font-size="18" fill="#172C45" font-weight="500" text-anchor="middle">Token + position embeddings</text>
<rect x="54" y="263" width="364" height="307" rx="13" fill="#F8FAFD" stroke="#C8D7E8" stroke-width="1.3"/>
<text x="76" y="289" font-size="19" fill="#52657B" font-weight="600" text-anchor="start">Decoder block</text>
<rect x="341" y="274" width="56" height="25" rx="12" fill="#E7EFF9" stroke="#E7EFF9" stroke-width="1.3"/>
<text x="369" y="292" font-size="18" fill="#3568B0" font-weight="600" text-anchor="middle">× 1</text>
<path d="M 236 240 V 315" fill="none" stroke="#3568B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)"/>
<rect x="100" y="318" width="272" height="60" rx="9" fill="#EAF2FD" stroke="#ADC6E7" stroke-width="1.3"/>
<text x="236" y="344" font-size="21" fill="#172C45" font-weight="600" text-anchor="middle">Causal self-attention</text>
<text x="236" y="367" font-size="18" fill="#3568B0" font-weight="400" text-anchor="middle">Q / K / V · 2 heads</text>
<path d="M 236 306 H 78 V 416 H 97" fill="none" stroke="#3568B0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)"/>
<circle cx="236" cy="306" r="3.1" fill="#3568B0"/>
<path d="M 236 379 V 394" fill="none" stroke="#3568B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)"/>
<rect x="100" y="397" width="272" height="38" rx="8" fill="#FFFFFF" stroke="#C8D7E8" stroke-width="1.3"/>
<text x="236" y="423" font-size="18" fill="#172C45" font-weight="400" text-anchor="middle">Residual add + LayerNorm</text>
<path d="M 236 436 V 454" fill="none" stroke="#3568B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)"/>
<path d="M 236 446 H 78 V 541 H 97" fill="none" stroke="#3568B0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)"/>
<circle cx="236" cy="446" r="3.1" fill="#3568B0"/>
