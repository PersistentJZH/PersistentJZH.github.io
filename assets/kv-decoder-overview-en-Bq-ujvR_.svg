<path d="M 236 502 V 519" fill="none" stroke="#3568B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)"/>
<rect x="100" y="522" width="272" height="38" rx="8" fill="#FFFFFF" stroke="#C8D7E8" stroke-width="1.3"/>
<text x="236" y="548" font-size="18" fill="#172C45" font-weight="400" text-anchor="middle">Residual add + LayerNorm</text>
<path d="M 373 348 H 456" fill="none" stroke="#3568B0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<rect x="466" y="263" width="244" height="154" rx="10" fill="#FFFFFF" stroke="#D6E0EA" stroke-width="1.3"/>
<text x="484" y="290" font-size="17" fill="#172C45" font-weight="500" text-anchor="start">Read self + earlier positions</text>
<text x="497" y="331" font-size="17" fill="#52657B" font-weight="400" text-anchor="start">Query</text>
<text x="604" y="318" font-size="18" fill="#52657B" font-weight="400" text-anchor="middle">我</text>
<text x="650" y="318" font-size="18" fill="#52657B" font-weight="400" text-anchor="middle">爱</text>
<text x="556" y="346" font-size="18" fill="#52657B" font-weight="400" text-anchor="middle">我</text>
<text x="556" y="386" font-size="18" fill="#52657B" font-weight="400" text-anchor="middle">爱</text>
<rect x="588" y="327" width="32" height="30" rx="5" fill="#B6CFEF" stroke="#FFFFFF" stroke-width="0"/>
<rect x="634" y="327" width="32" height="30" rx="5" fill="#F0F3F6" stroke="#FFFFFF" stroke-width="0"/>
<text x="650" y="349" font-size="22" fill="#8D9CAC" font-weight="400" text-anchor="middle">×</text>
<rect x="588" y="367" width="32" height="30" rx="5" fill="#B6CFEF" stroke="#FFFFFF" stroke-width="0"/>
<rect x="634" y="367" width="32" height="30" rx="5" fill="#B6CFEF" stroke="#FFFFFF" stroke-width="0"/>
<text x="498" y="405" font-size="16" fill="#52657B" font-weight="400" text-anchor="start">× Masked</text>
<path d="M 236 561 V 600" fill="none" stroke="#3568B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)"/>
<rect x="100" y="603" width="272" height="65" rx="9" fill="#EDF4FC" stroke="#B9CEE7" stroke-width="1.3"/>
<text x="236" y="630" font-size="17" fill="#172C45" font-weight="500" text-anchor="middle">Use the last position&#x27;s output</text>
<text x="236" y="654" font-size="16" fill="#52657B" font-weight="400" text-anchor="middle">Vocabulary projection → softmax</text>
<path d="M 373 636 H 462" fill="none" stroke="#3568B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)"/>
<rect x="466" y="585" width="244" height="90" rx="10" fill="#FFFFFF" stroke="#A8D6CA" stroke-width="1.3"/>
<text x="484" y="610" font-size="17" fill="#12665D" font-weight="500" text-anchor="start">Select the most likely token</text>
<rect x="487" y="625" width="66" height="36" rx="8" fill="#E9F6F1" stroke="#168476" stroke-width="1.3"/>
<text x="520.0" y="651.0" font-size="23" fill="#12665D" font-weight="600" text-anchor="middle">爱</text>
<text x="573" y="651" font-size="23" fill="#12665D" font-weight="600" text-anchor="start">51.11%</text>
<path d="M 588 584 V 550" fill="none" stroke="#168476" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#greenArrow)"/>
<rect x="466" y="438" width="244" height="109" rx="10" fill="#F7FCFA" stroke="#A8D6CA" stroke-width="1.3"/>
<text x="484" y="467" font-size="21" fill="#12665D" font-weight="600" text-anchor="start">Append to the text</text>
<rect x="483" y="490" width="64" height="37" rx="8" fill="#F4F7FA" stroke="#D6E0EA" stroke-width="1.3"/>
<text x="515.0" y="516.5" font-size="18" fill="#172C45" font-weight="600" text-anchor="middle">1 · 我</text>
<rect x="553" y="490" width="64" height="37" rx="8" fill="#F4F7FA" stroke="#D6E0EA" stroke-width="1.3"/>
<text x="585.0" y="516.5" font-size="18" fill="#172C45" font-weight="600" text-anchor="middle">2 · 爱</text>
