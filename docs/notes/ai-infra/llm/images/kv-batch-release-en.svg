<svg xmlns="http://www.w3.org/2000/svg" width="560" height="404.444444" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">Round 1: B finishes and releases its blocks</title>
<desc id="desc">Scheduling rounds start after A and B have completed Prefill. A3 and B3 hold K/V for position 3 of each request. A initially owns block 0 and B block 1. During Decode, A takes block 2 and B block 3. B then finishes and releases blocks 1 and 3. A keeps blocks 0 and 2.</desc>
