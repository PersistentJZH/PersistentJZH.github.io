<svg xmlns="http://www.w3.org/2000/svg" width="560" height="287.777778" viewBox="0 0 720 370" role="img" aria-labelledby="title desc">
<title id="title">提前预留：空着，也不能给 B</title>
<desc id="desc">同一个缓存池中，A1、A2 已有数据，后六格没有数据但已经预留给 A。B1、B2 到来后没有可分配的空位，需要等待。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#356BC3"/></marker></defs>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<rect x="1" y="1" width="718" height="368" rx="16" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1"/>
<text x="28" y="40" font-size="25" fill="#182A43" font-weight="700" text-anchor="start">提前预留：空着，也不能给 B</text>
<text x="30" y="82" font-size="23" fill="#506277" font-weight="600" text-anchor="start">同一个缓存池</text><rect x="44" y="104" width="72" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="80.0" y="145.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A1</text><rect x="124" y="104" width="72" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="160.0" y="145.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A2</text><rect x="204" y="104" width="72" height="64" rx="10" fill="#FFF3D8" stroke="#B87916" stroke-width="1.8" stroke-dasharray="6 4"/><text x="240.0" y="145.0" font-size="23" fill="#8A5710" font-weight="600" text-anchor="middle">A</text><rect x="284" y="104" width="72" height="64" rx="10" fill="#FFF3D8" stroke="#B87916" stroke-width="1.8" stroke-dasharray="6 4"/><text x="320.0" y="145.0" font-size="23" fill="#8A5710" font-weight="600" text-anchor="middle">A</text><rect x="364" y="104" width="72" height="64" rx="10" fill="#FFF3D8" stroke="#B87916" stroke-width="1.8" stroke-dasharray="6 4"/><text x="400.0" y="145.0" font-size="23" fill="#8A5710" font-weight="600" text-anchor="middle">A</text><rect x="444" y="104" width="72" height="64" rx="10" fill="#FFF3D8" stroke="#B87916" stroke-width="1.8" stroke-dasharray="6 4"/><text x="480.0" y="145.0" font-size="23" fill="#8A5710" font-weight="600" text-anchor="middle">A</text><rect x="524" y="104" width="72" height="64" rx="10" fill="#FFF3D8" stroke="#B87916" stroke-width="1.8" stroke-dasharray="6 4"/><text x="560.0" y="145.0" font-size="23" fill="#8A5710" font-weight="600" text-anchor="middle">A</text><rect x="604" y="104" width="72" height="64" rx="10" fill="#FFF3D8" stroke="#B87916" stroke-width="1.8" stroke-dasharray="6 4"/><text x="640.0" y="145.0" font-size="23" fill="#8A5710" font-weight="600" text-anchor="middle">A</text><rect x="44" y="187" width="24" height="24" rx="5" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="80" y="206" font-size="22" fill="#506277" font-weight="400" text-anchor="start">已经写入数据</text><rect x="310" y="187" width="24" height="24" rx="5" fill="#FFF3D8" stroke="#B87916" stroke-width="1.8" stroke-dasharray="5 3"/><text x="346" y="206" font-size="22" fill="#506277" font-weight="400" text-anchor="start">尚无数据，已归 A</text><text x="44" y="255" font-size="23" fill="#115E50" font-weight="600" text-anchor="start">新请求 B</text><rect x="44" y="275" width="72" height="64" rx="10" fill="#E1F5EE" stroke="#14836D" stroke-width="1.8"/><text x="80.0" y="316.0" font-size="26" fill="#115E50" font-weight="600" text-anchor="middle">B1</text><rect x="124" y="275" width="72" height="64" rx="10" fill="#E1F5EE" stroke="#14836D" stroke-width="1.8"/><text x="160.0" y="316.0" font-size="26" fill="#115E50" font-weight="600" text-anchor="middle">B2</text><text x="238" y="295" font-size="25" fill="#AF4935" font-weight="700" text-anchor="start">B 需要等待</text><text x="238" y="330" font-size="23" fill="#506277" font-weight="400" text-anchor="start">没有可分配的空位</text>
</g>
</svg>
