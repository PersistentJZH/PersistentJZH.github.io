<svg xmlns="http://www.w3.org/2000/svg" width="560" height="381.111111" viewBox="0 0 720 490" role="img" aria-labelledby="title desc">
<title id="title">Request A: keep old K/V, append new rows</title>
<desc id="desc">A1 = K/V for position 1 of request A. Call 1 retains A1 and A2. Call 2 keeps them and appends A3. Call 3 keeps the first three positions and appends A4. Attention at each new position still reads historical K/V.</desc>
