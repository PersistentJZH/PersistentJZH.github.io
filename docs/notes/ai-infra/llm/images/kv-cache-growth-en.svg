<text x="28" y="40" font-size="24" fill="#182A43" font-weight="700" text-anchor="start">Request A: keep old K/V, append new rows</text>
<text x="30" y="68" font-size="22" fill="#506277" font-weight="400" text-anchor="start">A1 = K/V for position 1 of request A</text>
