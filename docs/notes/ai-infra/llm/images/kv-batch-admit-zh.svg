<svg xmlns="http://www.w3.org/2000/svg" width="560" height="435.555556" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">调度轮 2：A 继续，C 加入</title>
<desc id="desc">C 是新到达的请求，C1 是 C 在位置 1 的 K/V。本轮 A 处理一个新位置，C 对两个输入位置做 Prefill。起点 A 在块 0、2，块 1、3 空闲。计算时 A4 填满块 2，C1、C2 写入块 1。A 输出后结束，释放块 0、2。C 保留块 1，下一轮才开始 Decode。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<rect x="1" y="1" width="718" height="558" rx="16" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1"/>
<text x="28" y="39" font-size="25" fill="#182A43" font-weight="700" text-anchor="start">调度轮 2：A 继续，C 加入</text>
<text x="30" y="69" font-size="21" fill="#506277" font-weight="400" text-anchor="start">C 是新请求；C1 = C 在位置 1 的 K/V</text>
<rect x="44" y="88" width="304" height="44" rx="9" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.5"/>
<text x="196" y="117" font-size="21" fill="#194C96" font-weight="600" text-anchor="middle">A：Decode 1 个新位置</text>
<rect x="372" y="88" width="304" height="44" rx="9" fill="#F0E9FF" stroke="#8458BB" stroke-width="1.5"/>
<text x="524" y="117" font-size="21" fill="#68449A" font-weight="600" text-anchor="middle">C：Prefill 2 个输入位置</text>
<text x="30" y="170" font-size="23" fill="#506277" font-weight="600" text-anchor="start">开始：接着上一轮结束后的布局</text>
<text x="120" y="198" font-size="21" fill="#506277" font-weight="600" text-anchor="middle">块 0</text>
<text x="280" y="198" font-size="21" fill="#506277" font-weight="600" text-anchor="middle">块 1</text>
<text x="440" y="198" font-size="21" fill="#506277" font-weight="600" text-anchor="middle">块 2</text>
<text x="600" y="198" font-size="21" fill="#506277" font-weight="600" text-anchor="middle">块 3</text>
<rect x="44" y="210" width="72" height="52" rx="9" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/>
<text x="80" y="244" font-size="25" fill="#194C96" font-weight="600" text-anchor="middle">A1</text>
<rect x="124" y="210" width="72" height="52" rx="9" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/>
<text x="160" y="244" font-size="25" fill="#194C96" font-weight="600" text-anchor="middle">A2</text>
<rect x="204" y="210" width="72" height="52" rx="9" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/>
<text x="240" y="244" font-size="22" fill="#65758A" font-weight="400" text-anchor="middle">空</text>
<rect x="284" y="210" width="72" height="52" rx="9" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/>
<text x="320" y="244" font-size="22" fill="#65758A" font-weight="400" text-anchor="middle">空</text>
<rect x="364" y="210" width="72" height="52" rx="9" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/>
<text x="400" y="244" font-size="25" fill="#194C96" font-weight="600" text-anchor="middle">A3</text>
<rect x="444" y="210" width="72" height="52" rx="9" fill="#FFF3D8" stroke="#B87916" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="480" y="244" font-size="25" fill="#8A5710" font-weight="600" text-anchor="middle">A</text>
<rect x="524" y="210" width="72" height="52" rx="9" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/>
<text x="560" y="244" font-size="22" fill="#65758A" font-weight="400" text-anchor="middle">空</text>
<rect x="604" y="210" width="72" height="52" rx="9" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/>
<text x="640" y="244" font-size="22" fill="#65758A" font-weight="400" text-anchor="middle">空</text>
<text x="30" y="301" font-size="23" fill="#506277" font-weight="600" text-anchor="start">本轮：A 追加 A4，C 建立自己的缓存</text>
<rect x="44" y="319" width="72" height="52" rx="9" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/>
<text x="80" y="353" font-size="25" fill="#194C96" font-weight="600" text-anchor="middle">A1</text>
<rect x="124" y="319" width="72" height="52" rx="9" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/>
<text x="160" y="353" font-size="25" fill="#194C96" font-weight="600" text-anchor="middle">A2</text>
<rect x="204" y="319" width="72" height="52" rx="9" fill="#F0E9FF" stroke="#8458BB" stroke-width="3"/>
<text x="240" y="353" font-size="25" fill="#68449A" font-weight="600" text-anchor="middle">C1</text>
<rect x="284" y="319" width="72" height="52" rx="9" fill="#F0E9FF" stroke="#8458BB" stroke-width="3"/>
<text x="320" y="353" font-size="25" fill="#68449A" font-weight="600" text-anchor="middle">C2</text>
<rect x="364" y="319" width="72" height="52" rx="9" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/>
<text x="400" y="353" font-size="25" fill="#194C96" font-weight="600" text-anchor="middle">A3</text>
<rect x="444" y="319" width="72" height="52" rx="9" fill="#E8F0FF" stroke="#356BC3" stroke-width="3"/>
<text x="480" y="353" font-size="25" fill="#194C96" font-weight="600" text-anchor="middle">A4</text>
<rect x="524" y="319" width="72" height="52" rx="9" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/>
<text x="560" y="353" font-size="22" fill="#65758A" font-weight="400" text-anchor="middle">空</text>
<rect x="604" y="319" width="72" height="52" rx="9" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/>
<text x="640" y="353" font-size="22" fill="#65758A" font-weight="400" text-anchor="middle">空</text>
<text x="30" y="410" font-size="23" fill="#506277" font-weight="600" text-anchor="start">轮末：A 结束，释放块 0、2</text>
<rect x="44" y="428" width="72" height="52" rx="9" fill="#F8FAFC" stroke="#73869D" stroke-width="1.8"/>
<text x="80" y="462" font-size="22" fill="#65758A" font-weight="400" text-anchor="middle">空</text>
<rect x="124" y="428" width="72" height="52" rx="9" fill="#F8FAFC" stroke="#73869D" stroke-width="1.8"/>
<text x="160" y="462" font-size="22" fill="#65758A" font-weight="400" text-anchor="middle">空</text>
<rect x="204" y="428" width="72" height="52" rx="9" fill="#F0E9FF" stroke="#8458BB" stroke-width="1.8"/>
<text x="240" y="462" font-size="25" fill="#68449A" font-weight="600" text-anchor="middle">C1</text>
<rect x="284" y="428" width="72" height="52" rx="9" fill="#F0E9FF" stroke="#8458BB" stroke-width="1.8"/>
<text x="320" y="462" font-size="25" fill="#68449A" font-weight="600" text-anchor="middle">C2</text>
<rect x="364" y="428" width="72" height="52" rx="9" fill="#F8FAFC" stroke="#73869D" stroke-width="1.8"/>
<text x="400" y="462" font-size="22" fill="#65758A" font-weight="400" text-anchor="middle">空</text>
<rect x="444" y="428" width="72" height="52" rx="9" fill="#F8FAFC" stroke="#73869D" stroke-width="1.8"/>
<text x="480" y="462" font-size="22" fill="#65758A" font-weight="400" text-anchor="middle">空</text>
<rect x="524" y="428" width="72" height="52" rx="9" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/>
<text x="560" y="462" font-size="22" fill="#65758A" font-weight="400" text-anchor="middle">空</text>
<rect x="604" y="428" width="72" height="52" rx="9" fill="#F8FAFC" stroke="#A6B3C3" stroke-width="1.8"/>
<text x="640" y="462" font-size="22" fill="#65758A" font-weight="400" text-anchor="middle">空</text>
<text x="30" y="531" font-size="22" fill="#506277" font-weight="400" text-anchor="start">C 保留 C1、C2，下一轮再做 Decode。</text>
</g>
</svg>
