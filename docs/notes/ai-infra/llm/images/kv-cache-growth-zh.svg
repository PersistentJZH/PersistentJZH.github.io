<svg xmlns="http://www.w3.org/2000/svg" width="560" height="381.111111" viewBox="0 0 720 490" role="img" aria-labelledby="title desc">
<title id="title">请求 A 的缓存：旧行保留，新行追加</title>
<desc id="desc">A1 = 请求 A 在位置 1 的 K/V。第一轮保存 A1、A2；第二轮保留它们并追加 A3；第三轮保留前三个位置并追加 A4。新位置的注意力仍读取所有历史 K/V。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#356BC3"/></marker></defs>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<rect x="1" y="1" width="718" height="488" rx="16" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1"/>
<text x="28" y="40" font-size="25" fill="#182A43" font-weight="700" text-anchor="start">请求 A 的缓存：旧行保留，新行追加</text>
<text x="30" y="68" font-size="22" fill="#506277" font-weight="400" text-anchor="start">A1 = 请求 A 在位置 1 的 K/V</text>
<text x="30" y="122" font-size="23" fill="#506277" font-weight="600" text-anchor="start">第 1 轮</text><rect x="166" y="82" width="108" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="220.0" y="123.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A1</text><rect x="292" y="82" width="108" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="346.0" y="123.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A2</text><path d="M 220 156 L 220 188" fill="none" stroke="#D7E0EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><path d="M 346 156 L 346 188" fill="none" stroke="#D7E0EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><text x="30" y="244" font-size="23" fill="#506277" font-weight="600" text-anchor="start">第 2 轮</text><rect x="166" y="204" width="108" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="220.0" y="245.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A1</text><rect x="292" y="204" width="108" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="346.0" y="245.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A2</text><rect x="418" y="204" width="108" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="3.5"/><text x="472.0" y="245.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A3</text><text x="472" y="295" font-size="21" fill="#194C96" font-weight="600" text-anchor="middle">新增</text><path d="M 220 278 L 220 310" fill="none" stroke="#D7E0EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><path d="M 346 278 L 346 310" fill="none" stroke="#D7E0EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><path d="M 472 278 L 472 310" fill="none" stroke="#D7E0EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><text x="30" y="366" font-size="23" fill="#506277" font-weight="600" text-anchor="start">第 3 轮</text><rect x="166" y="326" width="108" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="220.0" y="367.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A1</text><rect x="292" y="326" width="108" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="346.0" y="367.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A2</text><rect x="418" y="326" width="108" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.8"/><text x="472.0" y="367.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A3</text><rect x="544" y="326" width="108" height="64" rx="10" fill="#E8F0FF" stroke="#356BC3" stroke-width="3.5"/><text x="598.0" y="367.0" font-size="26" fill="#194C96" font-weight="600" text-anchor="middle">A4</text><text x="598" y="417" font-size="21" fill="#194C96" font-weight="600" text-anchor="middle">新增</text><text x="30" y="459" font-size="23" fill="#506277" font-weight="400" text-anchor="start">旧 K/V 继续保留，下一轮还要读取。</text>
