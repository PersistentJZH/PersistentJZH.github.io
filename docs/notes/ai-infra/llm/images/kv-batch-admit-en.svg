<text x="28" y="39" font-size="25" fill="#182A43" font-weight="700" text-anchor="start">Round 2: A continues and C joins</text>
<text x="30" y="69" font-size="21" fill="#506277" font-weight="400" text-anchor="start">C is new; C1 = K/V for position 1 of C</text>
