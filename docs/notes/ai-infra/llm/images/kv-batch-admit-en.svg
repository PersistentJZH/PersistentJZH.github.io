<svg xmlns="http://www.w3.org/2000/svg" width="560" height="435.555556" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">Round 2: A continues and C joins</title>
<desc id="desc">C is a newly arrived request. C1 holds K/V for position 1 of C. This round A decodes one new position while C prefills two input positions. A starts with blocks 0 and 2; blocks 1 and 3 are free. A4 fills block 2 and C1/C2 enter block 1. A then finishes and releases blocks 0 and 2. C keeps block 1 and begins Decode on the next round.</desc>
