<rect x="456" y="335" width="150" height="50" rx="7" fill="#F0E9FF" stroke="#8458BB" stroke-width="1.2"/>
<text x="531.0" y="357" font-size="21" fill="#68449A" font-weight="600" text-anchor="middle">Prefill</text>
<text x="531.0" y="378" font-size="17" fill="#68449A" font-weight="400" text-anchor="middle">token 1</text>
<rect x="614" y="335" width="150" height="50" rx="7" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.2"/>
<text x="689.0" y="357" font-size="21" fill="#194C96" font-weight="600" text-anchor="middle">Decode</text>
<text x="689.0" y="378" font-size="17" fill="#194C96" font-weight="400" text-anchor="middle">token 2</text>
<rect x="28" y="413" width="744" height="248" rx="12" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1.2"/>
<text x="44" y="443" font-size="21" fill="#182A43" font-weight="600" text-anchor="start">Continuous: C&#x27;s Prefill joins iteration 2</text>
<rect x="294" y="453" width="158" height="199" rx="10" fill="#F8F7FC" stroke="#D8CBEF" stroke-width="1"/>
<text x="215.0" y="478" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">Iter. 1</text>
<text x="373.0" y="478" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">Iter. 2</text>
<text x="531.0" y="478" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">Iter. 3</text>
<text x="689.0" y="478" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">Iter. 4</text>
<text x="294" y="466" font-size="15" fill="#8A5710" font-weight="500" text-anchor="middle">C arrives</text>
<path d="M 294 483 L 294 650" fill="none" stroke="#B87916" stroke-width="1.3" stroke-dasharray="4 4"/>
<text x="76" y="523" font-size="25" fill="#182A43" font-weight="650" text-anchor="middle">A</text>
