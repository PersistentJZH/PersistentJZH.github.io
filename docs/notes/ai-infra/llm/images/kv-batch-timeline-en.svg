<rect x="298" y="603" width="150" height="50" rx="7" fill="#F0E9FF" stroke="#8458BB" stroke-width="1.2"/>
<text x="373.0" y="625" font-size="21" fill="#68449A" font-weight="600" text-anchor="middle">Prefill</text>
<text x="373.0" y="646" font-size="17" fill="#68449A" font-weight="400" text-anchor="middle">token 1</text>
<rect x="456" y="603" width="150" height="50" rx="7" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.2"/>
<text x="531.0" y="625" font-size="21" fill="#194C96" font-weight="600" text-anchor="middle">Decode</text>
<text x="531.0" y="646" font-size="17" fill="#194C96" font-weight="400" text-anchor="middle">token 2</text>
<rect x="614" y="603" width="150" height="50" rx="7" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.2"/>
