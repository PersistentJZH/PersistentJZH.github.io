<text x="215.0" y="367" font-size="18" fill="#506277" font-weight="400" text-anchor="middle">Not here yet</text>
<rect x="298" y="335" width="150" height="50" rx="7" fill="#FFF3D8" stroke="#B87916" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="373.0" y="357" font-size="21" fill="#8A5710" font-weight="500" text-anchor="middle">Waiting</text>
