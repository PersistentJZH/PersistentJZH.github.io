<text x="531.0" y="523" font-size="18" fill="#506277" font-weight="400" text-anchor="middle">Finished</text>
<rect x="614" y="491" width="150" height="50" rx="7" fill="#F7F9FB" stroke="#C9D3DF" stroke-width="1.2"/>
<text x="689.0" y="523" font-size="18" fill="#506277" font-weight="400" text-anchor="middle">Finished</text>
