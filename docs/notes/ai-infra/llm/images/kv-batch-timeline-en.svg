<text x="215.0" y="534" font-size="17" fill="#194C96" font-weight="400" text-anchor="middle">token 2</text>
<rect x="298" y="491" width="150" height="50" rx="7" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.2"/>
<text x="373.0" y="513" font-size="21" fill="#194C96" font-weight="600" text-anchor="middle">Decode</text>
<text x="373.0" y="534" font-size="17" fill="#194C96" font-weight="400" text-anchor="middle">token 3 · end</text>
