<text x="689.0" y="646" font-size="17" fill="#194C96" font-weight="400" text-anchor="middle">token 3</text>
<rect x="28" y="680" width="12" height="12" rx="3" fill="#F0E9FF" stroke="#8458BB" stroke-width="1.2"/>
<text x="50" y="693" font-size="19" fill="#68449A" font-weight="400" text-anchor="start">Prefill: process the prompt, emit output token 1.</text>
<rect x="28" y="708" width="12" height="12" rx="3" fill="#E8F0FF" stroke="#356BC3" stroke-width="1.2"/>
<text x="50" y="721" font-size="18" fill="#194C96" font-weight="400" text-anchor="start">Decode: process 1 new position, emit 1 more token per iteration.</text>
<text x="28" y="754" font-size="18" fill="#506277" font-weight="400" text-anchor="start">Numbers refer to output tokens; iterations need not take equal time.</text>
