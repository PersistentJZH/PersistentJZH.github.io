<svg xmlns="http://www.w3.org/2000/svg" width="560" height="548.8" viewBox="0 0 800 784" role="img" aria-labelledby="title desc">
<title id="title">When does C start Prefill and Decode?</title><desc id="desc">A and B have already completed Prefill on two prompt positions each and emitted their first output token before iteration 1. C arrives after iteration 1. With fixed batching, C waits in iteration 2, runs Prefill and emits token 1 in iteration 3, then runs Decode and emits token 2 in iteration 4. With continuous batching, A Decode and C Prefill share iteration 2; C emits token 1 then, emits token 2 with Decode in iteration 3, and continues Decode to emit token 3 in iteration 4. Cell numbers refer to output tokens, not input positions. Iterations need not take equal time.</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif">
<rect x="1" y="1" width="798" height="782" rx="16" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1.2"/>
<text x="28" y="40" font-size="25" fill="#182A43" font-weight="650" text-anchor="start">When does C start Prefill and Decode?</text>
<rect x="28" y="59" width="744" height="70" rx="10" fill="#F4F7FB" stroke="#D7E0EA" stroke-width="1.2"/>
<text x="45" y="86" font-size="19" fill="#182A43" font-weight="500" text-anchor="start">Shared start: A and B have each run Prefill on 2 prompt positions</text>
<text x="45" y="114" font-size="19" fill="#506277" font-weight="400" text-anchor="start">Each has emitted token 1. Scheduling iteration 1 starts below.</text>
<rect x="28" y="145" width="744" height="248" rx="12" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="1.2"/>
<text x="44" y="175" font-size="21" fill="#182A43" font-weight="600" text-anchor="start">Fixed: C waits until both A and B finish</text>
<text x="215.0" y="210" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">Iter. 1</text>
<text x="373.0" y="210" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">Iter. 2</text>
<text x="531.0" y="210" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">Iter. 3</text>
<text x="689.0" y="210" font-size="20" fill="#506277" font-weight="600" text-anchor="middle">Iter. 4</text>
<text x="294" y="198" font-size="15" fill="#8A5710" font-weight="500" text-anchor="middle">C arrives</text>
<path d="M 294 215 L 294 382" fill="none" stroke="#B87916" stroke-width="1.3" stroke-dasharray="4 4"/>
<text x="76" y="255" font-size="25" fill="#182A43" font-weight="650" text-anchor="middle">A</text>
<text x="76" y="311" font-size="25" fill="#182A43" font-weight="650" text-anchor="middle">B</text>
<text x="76" y="367" font-size="25" fill="#182A43" font-weight="650" text-anchor="middle">C</text>
